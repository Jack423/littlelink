<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
  <title>DJ Roury</title>
  <link rel="icon" type="image/x-icon" href="https://ik.imagekit.io/cjkkwlpug/Untitled.jpg?tr=w-24,h-24">
  <!-- Update this with your own favicon -->

  <!-- Meta Description - Write a description (150-160 characters recommended) -->
  <meta name="description" content="DJ Roury">

  <!-- Keywords -->
  <meta name="keywords" content="DJ, Photography, Music, Furry, EDM, FANG">

  <!-- Canonical URL - Helps prevent duplicate content issues -->
  <meta rel="canonical" href="https://links.roury.media">

  <!-- Author Information -->
  <meta name="author" content="DJ Roury">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">

  <!-- LittleLink Extended Stylesheet (Optional) -->
  <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
  <!-- Learn more at https://github.com/sethcottle/littlelink-extended. Remove comments if you've added LittleLink Extended dependencies -->

</head>

<body>

  <div class="container">
    <div class="column">

      <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
      <img class="avatar avatar--rounded" src="https://ik.imagekit.io/cjkkwlpug/Untitled.jpg?tr=w-200,h-200"
        srcset="https://ik.imagekit.io/cjkkwlpug/Untitled.jpg?tr=w-400,h-400" alt="LittleLink">

      <!-- Replace with your name or brand -->
      <h1>
        <div>DJ Roury</div>
      </h1>

      <!-- Add a short description about yourself or your brand -->
      <p>DJ | Photographer | Madison, WI 🇺🇸</p>

      <!-- All your buttons go here -->
      <div class="button-stack" role="navigation">
        <!-- SoundCloud -->
        <a class="button button-soundcloud" href="https://soundcloud.com/dj-roury" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/soundcloud.svg"
            alt="SoundCloud Logo">SoundCloud</a>

        <!-- Instagram -->
        <a class="button button-instagram" href="https://www.instagram.com/dj_roury/" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg"
            alt="Instagram Logo">Instagram</a>

        <!-- Bluesky -->
        <a class="button button-bluesky" href="https://bsky.app/profile/roury.cat" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg"
            alt="Bluesky Logo">Bluesky</a>

        <!-- YouTube -->
        <a class="button button-yt-alt" href="https://www.youtube.com/@DJRoury" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube-alt.svg"
            alt="YouTube Logo">YouTube</a>

        <!-- Telegram -->
        <a class="button button-telegram" href="https://t.me/RouryTheCat" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/telegram.svg"
            alt="Telegram Logo">Telegram</a>

        <!-- Twitter -->
        <a class="button button-twitter" href="https://x.com/RouryTheCat" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/twitter.svg"
            alt="Twitter icon">Twitter</a>

        <!-- Generic Email -->
        <a class="button button-default" href="mailto:djrouryedm@gmail.com" target="_blank" rel="noopener"
          role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg"
            alt="Email Icon">Contact and Booking</a>

        <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
        <footer>
          Jack Butler © 2026
        </footer>

      </div>
    </div>

</body>

</html>
